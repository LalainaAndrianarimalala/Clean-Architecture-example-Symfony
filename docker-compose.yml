services:
  php:
    build: .
    ports:
      - "8080:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./:/app
    environment:
      - SERVER_NAME=localhost
      - REDIS_HOST=redis
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_started

  database:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      - MYSQL_DATABASE=timesheet
      - MYSQL_USER=app
      - MYSQL_PASSWORD=secret
      - MYSQL_ROOT_PASSWORD=root_secret
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "app", "-psecret"]
      interval: 5s
      timeout: 5s
      retries: 5

  phpmyadmin:
    image: phpmyadmin:latest
    ports:
      - "8081:80"
    environment:
      - PMA_HOST=database
      - PMA_PORT=3306
      - PMA_USER=app
      - PMA_PASSWORD=secret
    depends_on:
      database:
        condition: service_healthy

  redis:
    image: redis:alpine
    ports:
      - "6380:6379"

volumes:
  db_data: