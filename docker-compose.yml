services:
  php:
    build: .
    ports:
      - "8080:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./:/app
    environment:
      - SERVER_NAME=localhost
      - REDIS_HOST=redis
      - DATABASE_URL=mysql://app:secret@database:3306/timesheet?serverVersion=8.0&charset=utf8mb4
    depends_on:
      database:
        condition: service_healthy
    networks:
      - app_network          # ✅ ajouté

  database:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      - MYSQL_DATABASE=timesheet
      - MYSQL_USER=app
      - MYSQL_PASSWORD=secret
      - MYSQL_ROOT_PASSWORD=root_secret
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "app", "-psecret"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app_network          # ✅ ajouté

  phpmyadmin:
    image: phpmyadmin:latest
    ports:
      - "8081:80"
    environment:
      - PMA_HOST=database
      - PMA_PORT=3306
      - PMA_USER=app
      - PMA_PASSWORD=secret
    depends_on:
      database:
        condition: service_healthy
    networks:
      - app_network          # ✅ ajouté

  redis:
    image: redis:alpine
    ports:
      - "6380:6379"
    networks:
      - app_network          # ✅ ajouté

volumes:
  db_data:

networks:
  app_network:
    driver: bridge           # ✅ réseau partagé explicite