services:
  php:
    build: .
    ports:
      - "8080:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./:/app
    environment:
      - SERVER_NAME=localhost
      - DATABASE_URL=mysql://app:secret@database:3306/timesheet?serverVersion=8.0&charset=utf8mb4
      # BUG FIX : REDIS_URL était absent → PHP tentait redis://localhost (introuvable)
      # et attendait 30 s jusqu'au timeout PHP.
      # Le paramètre timeout=2 évite de bloquer si Redis est temporairement indisponible.
      - REDIS_URL=redis://redis:6379?timeout=2
      - MESSENGER_TRANSPORT_DSN=redis://redis:6379/messages
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - app_network

  database:
    image: mysql:8.0
    ports:
      - "3306:3306"
    environment:
      - MYSQL_DATABASE=timesheet
      - MYSQL_USER=app
      - MYSQL_PASSWORD=secret
      - MYSQL_ROOT_PASSWORD=root_secret
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "app", "-psecret"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  phpmyadmin:
    image: phpmyadmin:latest
    ports:
      - "8081:80"
    environment:
      - PMA_HOST=database
      - PMA_PORT=3306
      - PMA_USER=app
      - PMA_PASSWORD=secret
    depends_on:
      database:
        condition: service_healthy
    networks:
      - app_network

  redis:
    image: redis:alpine
    ports:
      - "6380:6379"
    networks:
      - app_network

volumes:
  db_data:

networks:
  app_network:
    driver: bridge